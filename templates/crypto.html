<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency - FinanceHub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header id="head_bar">
        <div id="logo">
            <span style="color: #3b82f6; font-weight: 700; font-size: 20px;">FinanceHub</span>
        </div>
        <nav style="display: flex; gap: 0; margin-left: auto; margin-right: 0;">
            <div id="head_home" class="headings">Home</div>
            <div id="head_myportfolio" class="headings">My Portfolio</div>
            <div id="head_psx" class="headings">PSX</div>
            <div id="head_commodity" class="headings">Commodities</div>
            <div id="head_crypto" class="headings active">Crypto</div>
            <div id="head_my_account" class="headings">My Account</div>
            <div id="head_login" class="headings">Login</div>
        </nav>
    </header>

    <main class="page-wrapper">
        <div class="container">
            <div class="content-section">
                <h2>Cryptocurrency Market</h2>
                <p style="color: #6b7280; margin-bottom: 1.5rem;">Track cryptocurrency prices and portfolio</p>

                <div class="alert alert-info">
                    🚀 Cryptocurrency tracking feature coming soon!
                </div>

                <div class="stats-grid" style="margin-top: 2rem;">
                    <div class="card">
                        <div class="stat-label">Total Crypto Holdings</div>
                        <div class="stat-value">$0.00</div>
                    </div>
                    <div class="card">
                        <div class="stat-label">24h Change</div>
                        <div class="stat-value" style="color: #10b981;">+0.00%</div>
                    </div>
                    <div class="card">
                        <div class="stat-label">Portfolio Value</div>
                        <div class="stat-value">$0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
