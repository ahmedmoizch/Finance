<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">

    <meta charset="UTF-8">

    <title>Holdings</title>
    <link rel="stylesheet" href="\static\style.css">
</head>
<div id="head_bar">

    <div id="head_home" class="headings">Home</div>
    <div id="head_myportfolio" class="headings">My Portfolio</div>
    <div id="head_psx" class="headings">PSX</div>
    <div id="head_commodity" class="headings">Commodities</div>

<body>
    <div>
        <H1>Add to Your Portfolio</H1><br>
        <form>
            <!--Radio Buttons for category-->

            <input type="radio" id="psx" name="asst_cat" value="PSX">
            <label for="psx">PSX</label><br>

            <input type="radio" id="commodity" name="asst_cat" value="commodity">
            <label for="commodity">Commodity</label><br>

            <input type="radio" id="crypto" name="asst_cat" value="crypto">
            <label for="crypto">Crypto</label>
            <br><br>

            <input type='text' placeholder="Name of Asset" name="asset_name">
            <input type='number' placeholder="Quantity" name="asset_quantity">
            <input type='number' placeholder="Comission" name="asset_comission">
        </form>
    </div>
